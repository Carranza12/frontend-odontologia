<app-sidebar></app-sidebar>
<main class="main_container">
  <app-page-title [title]="'Respaldos'"></app-page-title>
  <button type="button" class="btn_primary" style="margin-bottom: 10px;" (click)="navigateBy('/superAdmin/respaldos/importar')" >Importar JSON</button>
  <div>
   
    <table class="table_grid">
      <thead>
        <tr>
          <th>Nombres</th>
          <th>Dataset</th>
          <th>Exportar JSON</th>
        </tr>
      </thead>
      <tbody>
         <tr *ngFor="let formulario of formulariosList">
          <td>{{ formulario.name }}</td>
          <td>{{ formulario.dataset }}</td>
        
          <td class="icon_container">
            <button type="button" class="btn_icon" (click)="search(formulario.dataset)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-down-circle" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v5.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293z"/>
              </svg></button>
          </td>
        </tr> 
      </tbody>
    </table>
   
  </div>
</main>
