<app-sidebar></app-sidebar>
<main class="main_container">
  <app-page-title [title]="'Perfil Estudiante'"></app-page-title>

  <div>
    <app-profile-card></app-profile-card>
    <form class="login-form" [formGroup]="perfilForm" (ngSubmit)="onSubmit()">
      <section style="padding: 20px;">
        <div>
            <p>Matricula</p>
          <input
            class="form_input"
            type="text"
            placeholder="Matricula"
            formControlName="Matricula"
            name="uniqueFieldName1"
            autocomplete="off"
          />
          <div
            *ngIf="
              perfilForm.get('Matricula')?.hasError('required') &&
              perfilForm.get('Matricula')?.touched
            "
            class="error-message"
          >
            La matricula es requerida.
          </div>
        </div>
        <div>
            <p>Semestre actual</p>
            <select
              class="form_input"
              formControlName="semestre_actual"
              name="semestre"
            >
            <option value="">Selecciona el semestre</option>
              <option [value]="semestre.value" *ngFor="let semestre of semestresList">{{semestre.text}}</option>
            </select>
            <div
              *ngIf="
              perfilForm.get('semestre_actual')?.hasError('required') &&
              perfilForm.get('semestre_actual')?.touched
              "
              class="error-message"
            >
              El semestre actual es requerido.
            </div>
          </div>
          <div>
            <p>Carrera</p>
            <select
              class="form_input"
              formControlName="carrera"
              name="semestre"
            >
            <option value="">Selecciona la carrera</option>
              <option [value]="carrera.value" *ngFor="let carrera of carrerasList">{{carrera.text}}</option>
            </select>
            <div
              *ngIf="
              perfilForm.get('carrera')?.hasError('required') &&
              perfilForm.get('carrera')?.touched
              "
              class="error-message"
            >
              La carrera es requerida.
            </div>
          </div>
        
        <button
          style="margin-top: 40px"
          type="button"
          (click)="onSubmit()"
          class="btn_primary"
        >
          Guardar perfil
        </button>
      </section>
    </form>
  </div>
</main>
